name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: install & import (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Entry point runs
        run: charpaste --version

      - name: Modules import cleanly
        # These modules avoid importing the GUI/tray libs at top level, so they
        # import fine on a headless CI runner. (Live typing/tray can't be
        # exercised without a real desktop + keyboard injection.)
        run: python -c "import charpaste, charpaste.app, charpaste.backends, charpaste.hotkey, charpaste.ipc, charpaste.config"

      - name: Byte-compile all sources
        run: python -m compileall -q charpaste
