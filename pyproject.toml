[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charpaste"
version = "0.2.0"
description = "Type clipboard contents character-by-character into clipboard-disabled remote sessions. Cross-platform tray app."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pystray>=0.19",
    "pillow>=9",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "evdev>=1.6 ; sys_platform == 'linux'",
]

[project.scripts]
charpaste = "charpaste.__main__:main"

[tool.setuptools.packages.find]
include = ["charpaste*"]
